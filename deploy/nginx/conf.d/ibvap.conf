# IBVAP Military-Grade Edge Gateway & WAF Configuration

upstream backend_upstream {
    server ibvap-backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all plain HTTP traffic to HTTPS in production
    # return 301 https://$host$request_uri;

    # Defense In Depth Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; media-src 'self' blob:; object-src 'none';" always;

    # Maximum client payload size (for evidence uploads)
    client_max_body_size 50M;

    # ── WAF Security Rules (Block Scanners, SQLi, LFI) ────────────────
    # Block malicious scanners and bots
    if ($http_user_agent ~* (nikto|sqlmap|acunetix|havij|nmap|dirbuster|masscan|zgrab)) {
        return 403;
    }

    # Block path traversal attempts
    if ($request_uri ~* "(\.\./|\.\.\\|%2e%2e|%2e%2e%2f)") {
        return 400;
    }

    # Block blatant SQL injection signatures
    if ($query_string ~* "(union.*select|information_schema|insert.*into|drop.*table|truncate.*table)") {
        return 403;
    }

    # ── Frontend Static Assets & SPA Routing ─────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # ── API Reverse Proxy with Rate Limiting ─────────────────────────
    location /api/ {
        limit_req zone=api_rate_limit burst=20 nodelay;
        limit_conn addr_conn_limit 20;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-ID $http_x_trace_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Sensitive Auth Endpoint Stricter Rate Limiting
    location /api/v1/auth/token {
        limit_req zone=auth_rate_limit burst=5 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket Real-Time Events & Video Streams ───────────────────
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Prometheus Telemetry Metrics (Internal Only) ─────────────────
    location /metrics {
        # Allow internal docker network and loopback
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        # In production edge deployments, comment 'allow all' to restrict strictly
        # deny all;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Single Page Application HTML5 Fallback ───────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
