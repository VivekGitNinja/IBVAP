<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBVAP — Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#040a12;--surface:#0a1628;--panel:#0d1f3c;--border:#1a2d4a;
  --text:#e0e8f0;--dim:#6b7d96;--cyan:#00d4ff;--red:#ff3355;
  --orange:#ff8833;--green:#00ff88;--yellow:#ffd700;--purple:#a855f7;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden}
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
/* Header */
.header{display:flex;align-items:center;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);gap:16px}
.header .logo{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--cyan);letter-spacing:2px}
.header .logo span{color:var(--text);font-weight:400;font-size:12px;margin-left:8px}
.header-stats{display:flex;gap:20px;margin-left:auto}
.hstat{text-align:center}
.hstat .val{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace}
.hstat .lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.hstat.critical .val{color:var(--red)}
.hstat.warning .val{color:var(--orange)}
.hstat.ok .val{color:var(--green)}
.hstat.info .val{color:var(--cyan)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.status-dot.online{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-dot.degraded{background:var(--orange);box-shadow:0 0 6px var(--orange)}
.status-dot.offline{background:var(--red)}
/* Main */
.main{display:grid;grid-template-columns:280px 1fr 340px;gap:1px;background:var(--border);overflow:hidden}
/* Sidebar */
.sidebar{background:var(--surface);padding:16px;overflow-y:auto}
.sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin-bottom:12px}
.cam-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.cam-card:hover,.cam-card.active{border-color:var(--cyan)}
.cam-card .cam-name{font-size:13px;font-weight:600;margin-bottom:4px}
.cam-card .cam-meta{font-size:11px;color:var(--dim);display:flex;gap:8px}
.cam-card .cam-status{font-size:11px;margin-top:6px}
/* Center */
.center{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.video-panel{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;min-height:300px}
.video-panel canvas{max-width:100%;max-height:100%}
.video-hud{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.7);padding:6px 12px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11px;border:1px solid var(--cyan);color:var(--cyan)}
.video-stats{position:absolute;bottom:12px;left:12px;right:12px;display:flex;gap:12px}
.video-stat{background:rgba(0,0,0,.7);padding:4px 10px;border-radius:4px;font-size:11px;font-family:'JetBrains Mono',monospace}
.bottom-panel{height:180px;background:var(--surface);border-top:1px solid var(--border);overflow-y:auto;padding:12px}
.event-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}
.event-time{font-family:'JetBrains Mono',monospace;color:var(--dim);width:70px;flex-shrink:0}
.event-sev{padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600;text-transform:uppercase;width:60px;text-align:center;flex-shrink:0}
.sev-CRITICAL{background:rgba(255,51,85,.2);color:var(--red)}
.sev-HIGH{background:rgba(255,136,51,.2);color:var(--orange)}
.sev-MEDIUM{background:rgba(255,215,0,.2);color:var(--yellow)}
.sev-LOW{background:rgba(0,212,255,.15);color:var(--cyan)}
.event-msg{flex:1;color:var(--text)}
/* Right Panel */
.right-panel{background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.panel-tabs{display:flex;border-bottom:1px solid var(--border)}
.panel-tab{flex:1;padding:10px;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;color:var(--dim);transition:all .2s}
.panel-tab.active{color:var(--cyan);border-bottom:2px solid var(--cyan)}
.panel-content{flex:1;overflow-y:auto;padding:12px}
/* Incident card */
.inc-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.inc-card:hover{border-color:var(--cyan)}
.inc-card .inc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.inc-card .inc-code{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim)}
.inc-card .inc-title{font-size:13px;font-weight:600;margin-bottom:6px}
.inc-card .inc-score{display:flex;align-items:center;gap:8px}
.inc-card .score-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.inc-card .score-fill{height:100%;border-radius:2px;transition:width .5s}
.inc-card .score-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.inc-card .inc-reasons{margin-top:8px}
.inc-card .inc-reason{font-size:11px;color:var(--dim);padding:2px 0}
/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
/* Loading */
.loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--dim)}
.spin{animation:spin 1s linear infinite;display:inline-block;margin-right:8px}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="logo">IBVAP <span>Intelligent Border Video Analytics Platform</span></div>
    <div class="header-stats">
      <div class="hstat info" id="hs-cameras"><div class="val">—</div><div class="lbl">Cameras</div></div>
      <div class="hstat critical" id="hs-incidents"><div class="val">—</div><div class="lbl">Incidents</div></div>
      <div class="hstat warning" id="hs-alerts"><div class="val">—</div><div class="lbl">Alerts</div></div>
      <div class="hstat ok" id="hs-pipeline"><div class="val">—</div><div class="lbl">Pipeline</div></div>
      <div class="hstat info" id="hs-fps"><div class="val">—</div><div class="lbl">Inference</div></div>
    </div>
    <div style="margin-left:16px;font-size:11px;color:var(--dim)" id="clock"></div>
  </header>
  
  <div class="main">
    <!-- Left: Cameras -->
    <div class="sidebar">
      <h3>Cameras</h3>
      <div id="camera-list"><div class="loading"><span class="spin">⟳</span> Loading...</div></div>
      <h3 style="margin-top:20px">Pipeline Modules</h3>
      <div id="modules-list"></div>
    </div>
    
    <!-- Center: Video + Events -->
    <div class="center">
      <div class="video-panel" id="video-panel">
        <canvas id="detection-canvas" width="640" height="360"></canvas>
        <div class="video-hud" id="video-hud">BOP-01 | YOLO26n | Initializing...</div>
        <div class="video-stats">
          <div class="video-stat" id="vs-objects">Objects: 0</div>
          <div class="video-stat" id="vs-frame">Frame: 0</div>
          <div class="video-stat" id="vs-time">--:--:--</div>
        </div>
      </div>
      <div class="bottom-panel">
        <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin-bottom:8px">Live Events</h3>
        <div id="events-feed"><div class="loading"><span class="spin">⟳</span> Waiting for events...</div></div>
      </div>
    </div>
    
    <!-- Right: Incidents -->
    <div class="right-panel">
      <div class="panel-tabs">
        <div class="panel-tab active" data-tab="incidents">Incidents</div>
        <div class="panel-tab" data-tab="alerts">Alerts</div>
      </div>
      <div class="panel-content" id="incidents-list"><div class="loading"><span class="spin">⟳</span> Loading...</div></div>
    </div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8080';

// Clock
function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString('en-IN',{hour12:false})+' UTC';
}
setInterval(updateClock,1000);updateClock();

// Fetch data
async function fetchJSON(url){
  try{const r=await fetch(url);return await r.json();}catch(e){return null;}
}

// Load cameras
async function loadCameras(){
  const cams=await fetchJSON(API+'/api/v1/cameras');
  if(!cams)return;
  document.getElementById('hs-cameras').querySelector('.val').textContent=cams.length;
  const online=cams.filter(c=>c.status==='ONLINE').length;
  let html='';
  cams.forEach(c=>{
    const dot=c.status==='ONLINE'?'online':c.status==='DEGRADED'?'degraded':'offline';
    html+=`<div class="cam-card" data-id="${c.id}">
      <div class="cam-name"><span class="status-dot ${dot}"></span>${c.name}</div>
      <div class="cam-meta"><span>${c.bop}</span><span>${c.resolution||'—'}</span></div>
      <div class="cam-status" style="color:${c.status==='ONLINE'?'var(--green)':c.status==='DEGRADED'?'var(--orange)':'var(--red)'}">${c.status} • Health: ${c.health_score||0}%</div>
    </div>`;
  });
  document.getElementById('camera-list').innerHTML=html;
}

// Load pipeline status
async function loadPipeline(){
  const data=await fetchJSON(API+'/api/v1/cameras/pipeline/status');
  if(!data||!data.pipelines)return;
  const ids=Object.keys(data.pipelines);
  document.getElementById('hs-pipeline').querySelector('.val').textContent=data.active_pipelines;
  let totalFrames=0,totalDet=0,infMs=0;
  let modulesHtml='';
  ids.forEach(id=>{
    const p=data.pipelines[id];
    totalFrames+=p.frames_processed;
    totalDet+=p.detections_total;
    infMs+=p.avg_inference_ms;
    modulesHtml+=`
      <div style="background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px">
        <div style="font-size:12px;font-weight:600;margin-bottom:6px">Camera ${p.camera_id}</div>
        <div style="font-size:11px;color:var(--dim)">
          Frames: <span style="color:var(--cyan)">${p.frames_processed}</span> • 
          Dets: <span style="color:var(--orange)">${p.detections_total}</span> • 
          Tracks: <span style="color:var(--green)">${p.tracks_active}</span>
        </div>
        <div style="font-size:11px;color:var(--dim);margin-top:4px">
          Inference: <span style="color:var(--yellow)">${p.avg_inference_ms}ms</span>
        </div>
        <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">
          <span style="font-size:10px;padding:2px 6px;border-radius:3px;background:${p.face_engine==='active'?'rgba(0,255,136,.15);color:var(--green)':'rgba(255,51,85,.15);color:var(--red)'}">Face: ${p.face_engine}</span>
          <span style="font-size:10px;padding:2px 6px;border-radius:3px;background:${p.reid_engine==='active'?'rgba(0,255,136,.15);color:var(--green)':'rgba(255,51,85,.15);color:var(--red)'}">ReID: ${p.reid_engine}</span>
          <span style="font-size:10px;padding:2px 6px;border-radius:3px;background:${p.rule_engine==='active'?'rgba(0,255,136,.15);color:var(--green)':'rgba(255,51,85,.15);color:var(--red)'}">Rules: ${p.rule_engine}</span>
          <span style="font-size:10px;padding:2px 6px;border-radius:3px;background:${p.night_enhancer==='active'?'rgba(0,255,136,.15);color:var(--green)':'rgba(255,51,85,.15);color:var(--red)'}">Night: ${p.night_enhancer}</span>
        </div>
      </div>`;
  });
  if(ids.length>0){
    document.getElementById('hs-fps').querySelector('.val').textContent=`${(infMs/ids.length).toFixed(0)}ms`;
  }
  document.getElementById('modules-list').innerHTML=modulesHtml;
}

// Load incidents
async function loadIncidents(){
  const incs=await fetchJSON(API+'/api/v1/incidents');
  if(!incs)return;
  document.getElementById('hs-incidents').querySelector('.val').textContent=incs.length;
  const crit=incs.filter(i=>i.severity==='CRITICAL').length;
  const high=incs.filter(i=>i.severity==='HIGH').length;
  document.getElementById('hs-incidents').querySelector('.lbl').textContent=`Incidents (${crit+high} hi/crit)`;
  
  let html='';
  incs.slice(0,50).forEach(i=>{
    const score=i.threat_score||0;
    const scoreColor=score>=70?'var(--red)':score>=40?'var(--orange)':score>=20?'var(--yellow)':'var(--cyan)';
    const reasons=i.reason_codes||[];
    html+=`<div class="inc-card">
      <div class="inc-header">
        <span class="inc-code">${i.incident_code}</span>
        <span class="event-sev sev-${i.severity}">${i.severity}</span>
      </div>
      <div class="inc-title">${i.title}</div>
      <div class="inc-score">
        <div class="score-bar"><div class="score-fill" style="width:${score}%;background:${scoreColor}"></div></div>
        <div class="score-val" style="color:${scoreColor}">${score.toFixed(0)}</div>
      </div>
      <div class="inc-reasons">
        ${reasons.slice(0,3).map(r=>`<div class="inc-reason">• ${r}</div>`).join('')}
      </div>
      <div style="margin-top:6px;font-size:10px;color:var(--dim)">Status: ${i.status} • Camera: ${i.camera_name||'—'}</div>
    </div>`;
  });
  document.getElementById('incidents-list').innerHTML=html;
}

// Load alerts
async function loadAlerts(){
  const alerts=await fetchJSON(API+'/api/v1/incidents/alerts');
  if(!alerts)return;
  document.getElementById('hs-alerts').querySelector('.val').textContent=alerts.length;
}

// Draw simulated detection canvas
let frameNum=0;
const canvas=document.getElementById('detection-canvas');
const ctx=canvas.getContext('2d');
const classes=[
  {name:'person',color:'#00ff88',w:40,h:80},
  {name:'car',color:'#ff8833',w:100,h:50},
  {name:'truck',color:'#00d4ff',w:120,h:60},
  {name:'bus',color:'#ffd700',w:140,h:70}
];
const objects=[];
for(let i=0;i<6;i++){
  const cls=classes[i%classes.length];
  objects.push({
    x:50+Math.random()*500,
    y:80+Math.random()*200,
    dx:(Math.random()-0.5)*2,
    dy:(Math.random()-0.5)*1,
    cls:cls,
    conf:0.5+Math.random()*0.45
  });
}

function drawFrame(){
  frameNum++;
  // Dark background
  ctx.fillStyle='#0a1628';
  ctx.fillRect(0,0,640,360);
  
  // Grid lines
  ctx.strokeStyle='rgba(0,212,255,0.08)';
  ctx.lineWidth=1;
  for(let x=0;x<640;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,360);ctx.stroke();}
  for(let y=0;y<360;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(640,y);ctx.stroke();}
  
  // Zone polygon
  ctx.strokeStyle='rgba(255,51,85,0.3)';
  ctx.fillStyle='rgba(255,51,85,0.05)';
  ctx.beginPath();
  ctx.moveTo(100,50);ctx.lineTo(400,50);ctx.lineTo(400,250);ctx.lineTo(100,250);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,51,85,0.5)';ctx.font='10px JetBrains Mono';
  ctx.fillText('RESTRICTED ZONE',120,45);
  
  // Objects
  let objCount=0;
  objects.forEach(o=>{
    o.x+=o.dx;o.y+=o.dy;
    if(o.x<20||o.x>600)o.dx*=-1;
    if(o.y<30||o.y>310)o.dy*=-1;
    objCount++;
    
    // Bounding box
    ctx.strokeStyle=o.cls.color;
    ctx.lineWidth=2;
    ctx.strokeRect(o.x,o.y,o.cls.w,o.cls.h);
    
    // Fill with transparent color
    ctx.fillStyle=o.cls.color+'20';
    ctx.fillRect(o.x,o.y,o.cls.w,o.cls.h);
    
    // Label
    ctx.fillStyle=o.cls.color;
    ctx.font='bold 11px JetBrains Mono';
    ctx.fillText(`${o.cls.name} ${(o.conf*100).toFixed(0)}%`,o.x,o.y-5);
    
    // Corner markers
    const s=8;
    ctx.lineWidth=3;
    [[o.x,o.y,o.x+s,o.y],[o.x,o.y,o.x,o.y+s],
     [o.x+o.cls.w,o.y,o.x+o.cls.w-s,o.y],[o.x+o.cls.w,o.y,o.x+o.cls.w,o.y+s],
     [o.x,o.y+o.cls.h,o.x+s,o.y+o.cls.h],[o.x,o.y+o.cls.h,o.x,o.y+o.cls.h-s],
     [o.x+o.cls.w,o.y+o.cls.h,o.x+o.cls.w-s,o.y+o.cls.h],[o.x+o.cls.w,o.y+o.cls.h,o.x+o.cls.w,o.y+o.cls.h-s]
    ].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});
  });
  
  // HUD overlay
  document.getElementById('video-hud').textContent=`BOP-01 | YOLO26n | ${objCount} objects | Frame ${frameNum}`;
  document.getElementById('vs-objects').textContent=`Objects: ${objCount}`;
  document.getElementById('vs-frame').textContent=`Frame: ${frameNum}`;
  document.getElementById('vs-time').textContent=new Date().toLocaleTimeString('en-IN',{hour12:false});
  
  requestAnimationFrame(drawFrame);
}
drawFrame();

// Events feed from API
async function loadEvents(){
  const incs=await fetchJSON(API+'/api/v1/incidents');
  if(!incs)return;
  let html='';
  incs.slice(0,20).forEach(i=>{
    const time=i.created_at?new Date(i.created_at).toLocaleTimeString('en-IN',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}):'--:--';
    html+=`<div class="event-row">
      <div class="event-time">${time}</div>
      <div class="event-sev sev-${i.severity}">${i.severity}</div>
      <div class="event-msg">${i.title}</div>
    </div>`;
  });
  document.getElementById('events-feed').innerHTML=html||'<div style="color:var(--dim);font-size:12px">No events yet</div>';
}

// Initial load
loadCameras();
loadPipeline();
loadIncidents();
loadAlerts();
loadEvents();

// Auto-refresh every 5 seconds
setInterval(()=>{loadCameras();loadPipeline();loadIncidents();loadAlerts();loadEvents();},5000);

// Tab switching
document.querySelectorAll('.panel-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.panel-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    if(tab.dataset.tab==='alerts'){
      loadAlerts().then(()=>{
        const alertsList=document.getElementById('incidents-list');
        // Show alerts in same panel
      });
    }else{
      loadIncidents();
    }
  });
});
</script>
</body>
</html>
