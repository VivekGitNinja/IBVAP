<script>
// Override fetch to serve mock data
const origFetch = window.fetch;
window.fetch = function(url, opts) {
  const path = typeof url === 'string' ? url : url.url;
  
  if (path.includes('/cameras/brands')) {
    return Promise.resolve(new Response(JSON.stringify(window.__MOCK_DATA__.brands), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  if (path.includes('/cameras') && path.includes('/discover')) {
    return Promise.resolve(new Response(JSON.stringify([
      {ip:'192.168.1.100',port:554,brand_hint:'RTSP Camera',rtsp_url:'rtsp://admin:@192.168.1.100:554/stream1',status:'found'},
      {ip:'192.168.1.101',port:554,brand_hint:'RTSP Camera',rtsp_url:'rtsp://admin:@192.168.1.101:554/stream1',status:'found'},
    ]), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  if (path.includes('/cameras/test-stream')) {
    return Promise.resolve(new Response(JSON.stringify({success:true,message:'Stream OK — 5 frames captured, 1920x1080',width:1920,height:1080,fps:15,frame_count:5}), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  if (path === '/api/v1/cameras' && (!opts || opts.method === 'GET')) {
    return Promise.resolve(new Response(JSON.stringify(window.__MOCK_DATA__.cameras), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  if (path === '/api/v1/cameras' && opts && opts.method === 'POST') {
    return Promise.resolve(new Response(JSON.stringify({id:99,...JSON.parse(opts.body)}), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  if (path.includes('/incidents/') && !path.includes('alerts')) {
    return Promise.resolve(new Response(JSON.stringify(window.__MOCK_DATA__.incidents), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  if (path.includes('/incidents/alerts')) {
    return Promise.resolve(new Response(JSON.stringify(window.__MOCK_DATA__.alerts), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  if (path.includes('/status')) {
    return Promise.resolve(new Response(JSON.stringify(window.__MOCK_DATA__.status), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  if (path.includes('/demo/scenarios')) {
    return Promise.resolve(new Response(JSON.stringify(window.__MOCK_DATA__.scenarios), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  if (path.includes('/demo/seed')) {
    return Promise.resolve(new Response(JSON.stringify({ok:true}), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  if (path.includes('/audit')) {
    return Promise.resolve(new Response(JSON.stringify([]), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  if (path.includes('/evidence/')) {
    return Promise.resolve(new Response(JSON.stringify([]), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  if (path.includes('/health')) {
    return Promise.resolve(new Response(JSON.stringify({status:'ok'}), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  if (path.includes('/cameras/') && path.includes('/health')) {
    return Promise.resolve(new Response(JSON.stringify([]), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  // Default: return empty
  return Promise.resolve(new Response(JSON.stringify([]), {status:200,headers:{'Content-Type':'application/json'}}));
};

// Override WebSocket
window.WebSocket = function() {
  return {
    close:()=>{},
    onopen:null, onclose:null, onmessage:null, onerror:null
  };
};
</script>
