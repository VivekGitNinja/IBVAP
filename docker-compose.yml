services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ibvap
      POSTGRES_USER: ibvap
      POSTGRES_PASSWORD: ibvap_dev_password
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://ibvap:ibvap_dev_password@db:5432/ibvap
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-in-compose
    ports: ["8000:8000"]
    depends_on: [db,redis]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
