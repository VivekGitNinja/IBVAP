services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ibvap
      POSTGRES_USER: ibvap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ibvap_dev_password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibvap -d ibvap"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://ibvap:${POSTGRES_PASSWORD:-ibvap_dev_password}@db:5432/ibvap
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-in-compose}
      ENVIRONMENT: production
      REQUIRE_AUTH: "true"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api:
        condition: service_started
volumes:
  pgdata:
